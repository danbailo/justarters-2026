[project]
name = "justarters-kit"
version = "0.1.0"
description = "Kit de exercícios do Justarters 2026: Introdução ao Python e Comunicação via APIs"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "ipython>=9.17.1",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]
bonus = ["playwright>=1.47"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "sessao_1/extras", "sessao_2/extras"]
